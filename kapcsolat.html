<!DOCTYPE html>
<html lang="hu">
<head>

    <link rel="stylesheet" href="style.css">

<body>

    <!-- FEJLÉC -->
    <header class="header">
        <div class="logo">
            <a href="index.html">
                <img src="imgs/492334550_3903755023210447_3029243163798136495_n.jpg" alt="Logo" class="logo-img">

<div class="contact-card">

    <div class="contact-info">
     
        <!-- 1. sor: Tógazda -->

            <span class="owner-name">Kresák Balázs</span>

           <!-- 2. sor: Cím -->
        <div class="info-row">
            <i class="fas fa-map-marker-alt icon"></i>
            <span class="label">Cím:</span> 
            <a href="https://maps.google.com/?q=Edelény,+Kavicsbányató" target="_blank" class="address-link">

            </a>
            <div class="click-hint">
                <i class="fas fa-arrow-left arrow-icon"></i>
                <span>katt ide</span>
            </div>
        </div>


        <!-- 3. sor: Telefon -->
        <div class="info-row">
            <i class="fas fa-phone-alt icon"></i>
            <span class="label">Telefon:</span> 
            <a href="tel:+36302805621" class="phone-link">+36 30 280 5621</a>
        </div>
    </div>
</div>

    <!-- LÁBLÉC -->
